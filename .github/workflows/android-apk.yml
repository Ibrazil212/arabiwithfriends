name: Build Android APK

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          # Public URL of the backend (dictionary + Gemini). Set it in the repo's Variables.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build:native

      - name: Sync web app to Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arabic-with-friends-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Rename APK for release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/arabic-with-friends-debug.apk

      - name: Publish APK to a fixed-URL pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Debug build (latest)
          prerelease: true
          body: "APK de teste gerado automaticamente a partir do main. Baixe o arquivo arabic-with-friends-debug.apk."
          files: android/app/build/outputs/apk/debug/arabic-with-friends-debug.apk
          fail_on_unmatched_files: true
